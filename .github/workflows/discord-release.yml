# Posts a release's notes to the Discord server's #releases channel again, from main's copy of the
# notes (gh workflow run discord-release.yml -f tag=v0.9.4). macos.yml posts when a tag is released.
name: Discord release post

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release, e.g. v0.9.4
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discord
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ inputs.tag }}
        run: python3 packaging/discord_release.py "$TAG"
